[package]
name = "stitchforge"
version = "0.1.0"
edition = "2024"
default-run = "stitchforge-app"

[dependencies]
calamine = "0.31"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
i_overlay = "9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
lopdf = { version = "0.45", default-features = false }
resvg = "0.45"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
usvg = "0.45"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
