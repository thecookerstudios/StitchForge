[package]
name = "stitchforge-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
stitchforge = { path = ".." }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
usvg = "0.45"
resvg = "0.45"
rfd = "0.17.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
log = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
serde = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
